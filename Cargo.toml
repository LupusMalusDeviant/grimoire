[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
authors = ["Lupus Malus Deviant"]
repository = "https://github.com/LupusMalusDeviant/grimoire"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
# Engine crates
grimoire = { path = "crates/grimoire" }
grimoire_assets = { path = "crates/grimoire_assets" }
grimoire_audio = { path = "crates/grimoire_audio" }
grimoire_collide = { path = "crates/grimoire_collide" }
grimoire_core = { path = "crates/grimoire_core" }
grimoire_debug = { path = "crates/grimoire_debug" }
grimoire_ecs = { path = "crates/grimoire_ecs" }
grimoire_exec = { path = "crates/grimoire_exec" }
grimoire_gpu = { path = "crates/grimoire_gpu" }
grimoire_platform = { path = "crates/grimoire_platform" }
grimoire_render = { path = "crates/grimoire_render" }
grimoire_sigil = { path = "crates/grimoire_sigil" }
grimoire_sigilc = { path = "crates/grimoire_sigilc" }
grimoire_sim = { path = "crates/grimoire_sim" }
grimoire_ui = { path = "crates/grimoire_ui" }

# Tool crates (engine ADR-0008): never a dependency of a runtime crate.
grimoire_bench = { path = "crates/grimoire_bench" }
grimoire_link = { path = "crates/grimoire_link" }
# Schema-codegen tool (project ADR-0011, WP8.1; engine ADR-0008's crate-map addendum and contract
# §1's table both record it). Has no grimoire_* dependency at all (not even a dev one); see the
# crate's own docs for why, and .github/scripts/check-crate-map.sh's NO_ENGINE_EDGE_TOOL_CRATES
# for how the crate-map check still accounts for a workspace member with no grimoire_* edge to
# check in the first place.
grimoire_schemagen = { path = "crates/grimoire_schemagen" }

# Third party. Versions are pinned deliberately; upgrades are explicit commits.
bytemuck = { version = "1.25.2", features = ["derive"] }
env_logger = "0.11.11"
libm = "0.2.16"
log = "0.4.34"
pollster = "1.0.1"
proptest = "1.11.0"
raw-window-handle = "0.6.2"
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = { version = "0.10.9", default-features = false, features = ["std"] }
thiserror = "2.0.20"
wgpu = "30.0.1"
winit = "0.30.13"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

# Optimised dependencies keep debug builds of wgpu/winit usable at interactive frame rates.
[profile.dev.package."*"]
opt-level = 2
