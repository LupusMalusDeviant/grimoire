[package]
name = "p0_callers"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Snippets that must keep failing: each documents a boundary the contract sets on purpose.
# StageInfo is an output-only type without a constructor (§2 rule 13 exemption).
expect-fail-stage-info = []
# StageFrame has no camera field before WP2.2 (§9.2).
expect-fail-camera-field = ["grimoire_p1/wp2-2-camera"]

