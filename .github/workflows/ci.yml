# Engine CI: format, standalone gate, docs, three-OS test matrix and float-probe comparison.
# Every push that triggers this workflow is watched until it finishes:
#   gh run watch --exit-status        (red run: gh run view --log-failed)
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

# Superseded pull request runs are cancelled. Runs on main are never cancelled: every main commit
# gets a verdict, gh run watch --exit-status does not end as "cancelled", and the main-only cache
# save is not lost.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: cargo fmt --check
        run: cargo fmt --all --check

  standalone-gate:
    name: Standalone gate (no fnp_ references)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Fail on fnp_ references (PRD-0002 FR-01)
        run: |
          set +e
          git grep -n -I -e 'fnp_' -- Cargo.toml ':(glob)crates/**/Cargo.toml' ':(glob)crates/**/*.rs'
          status=$?
          set -e
          case "$status" in
            0)
              echo "::error title=Standalone-Gate verletzt::Die Engine referenziert Spiel-Code (fnp_). Grimoire muss ohne das Spiel bauen und testen (PRD-0002 FR-01)."
              exit 1
              ;;
            1)
              echo "Keine fnp_-Referenzen in Cargo.toml oder crates/ gefunden."
              ;;
            *)
              echo "::error title=Standalone-Gate defekt::git grep ist mit Status ${status} fehlgeschlagen."
              exit "$status"
              ;;
          esac

  docs:
    name: rustdoc (deny warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Engine ADR-0006 building block 6: no crate with the determinism clippy.toml depends on rayon,
      # rayon-core or grimoire_exec (normal, build or dev, all targets); the clippy.toml stay identical.
      - name: Determinism crates do not depend on rayon (engine ADR-0006)
        run: bash .github/scripts/check-thread-source.sh
      # Contract §1 / engine ADR-0008: every grimoire_* edge (normal, build, dev) is on the crate map
      # allowlist. The self-test runs synthetic edges first, so a broken check cannot pass silently.
      - name: Self-test the crate map check
        run: bash .github/scripts/check-crate-map.sh --self-test
      - name: Crate dependencies follow the crate map (contract §1, engine ADR-0008)
        run: bash .github/scripts/check-crate-map.sh
      - name: cargo doc
        run: cargo doc --workspace --no-deps --locked

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Lavapipe gives Linux a software Vulkan adapter and Windows runners have WARP, so a missing
      # adapter fails the GPU tests there. macOS runners may lack Metal: the tests skip with a
      # ::warning:: line in the log.
      - name: Install software Vulkan (lavapipe)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Feature `fixtures` (contract §9.2) is non-default, so the workspace clippy run above never
      # sees `grimoire::fixtures` (the player proxy, §9.5); a dedicated, all-features run is the
      # only way to lint it (Umsetzung WP1.3).
      - name: Clippy (grimoire, feature fixtures)
        run: cargo clippy -p grimoire --all-targets --all-features --locked -- -D warnings
      # rust-cache restores target/; drop probes from older runs so the artifact is this run's.
      - name: Remove stale float probes
        run: rm -rf target/float-probe
      # --no-fail-fast: a red test binary must not stop the float probes and golden tests of the
      # binaries after it (engine ADR 0004).
      - name: Test
        env:
          GRIMOIRE_REQUIRE_GPU_ADAPTER: ${{ runner.os == 'macOS' && '0' || '1' }}
        run: cargo test --workspace --locked --no-fail-fast
      # `cargo test --workspace` silently skips tests behind the non-default `fixtures` feature
      # (`tests/player_proxy.rs`, `required-features = ["fixtures"]`); contract §9.2 requires this
      # dedicated step so the player proxy (§9.5) is actually exercised in CI (Umsetzung WP1.3).
      - name: Test (grimoire, feature fixtures)
        run: cargo test -p grimoire --features fixtures --locked --no-fail-fast
      # Local test runs force the CPU adapter; prove that path (WARP on Windows, lavapipe on Linux).
      # macOS has no CPU adapter. --workspace keeps the feature resolution of the Test step, so the
      # wgpu build is reused instead of compiled again.
      - name: Test offscreen rendering on the CPU adapter
        if: runner.os != 'macOS'
        env:
          GRIMOIRE_GPU_ADAPTER: software
          GRIMOIRE_REQUIRE_GPU_ADAPTER: "1"
        run: cargo test --workspace --test offscreen --locked
      # Examples open windows: build them, never run them in CI.
      - name: Build examples
        run: cargo build --workspace --examples --locked
      - name: Upload float probe
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: float-probe-${{ matrix.os }}
          path: target/float-probe/
          if-no-files-found: error
          retention-days: 14

  float-compare:
    name: Float probe comparison
    needs: test
    # Compare whatever probes exist, even if one OS failed its tests.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - name: Download float probes
        # A run without any probe must still reach the comparison step, which reports it.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: float-probe-*
          # Flat layout for any number of matches (a single match is never nested).
          merge-multiple: true
          path: float-probe
      - name: Self-test the float probe comparison
        run: bash .github/scripts/test-compare-float-probes.sh
      - name: Compare float probes across operating systems
        env:
          # Missing core probes fail the comparison only if every test job succeeded.
          TESTS_RESULT: ${{ needs.test.result }}
        run: bash .github/scripts/compare-float-probes.sh float-probe "Debug-Build"
