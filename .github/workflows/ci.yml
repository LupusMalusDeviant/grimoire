# Engine CI: format, standalone gate, docs, three-OS test matrix, float-probe comparison and the
# Sigil unit identity gate.
# Every push that triggers this workflow is watched until it finishes:
#   gh run watch --exit-status        (red run: gh run view --log-failed)
name: CI

# `docs/formats/*.md` is generated output (project ADR-0011, WP8.1), not prose documentation: a
# commit that touches only those pages (or the `schema/*.gschema` sources they are generated
# from) must still run the "generated schema code is current" drift check (job `docs`, step
# "Generated schema code is current"), or a schema/docs edit that forgets to regenerate goes
# unchecked. `paths-ignore` patterns are evaluated in order with later patterns overriding earlier
# ones and a `!`-prefixed pattern negating a match (GitHub Actions path-filter semantics); putting
# `!docs/formats/**` after the broad doc excludes re-includes that one subtree while every other
# `**/*.md`/`docs/**` change stays excluded. `schema/**` itself is not `**/*.md` or under `docs/`,
# so it already triggers the workflow without a filter change.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "!docs/formats/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "!docs/formats/**"
  workflow_dispatch:

# Superseded pull request runs are cancelled. Runs on main are never cancelled: every main commit
# gets a verdict, gh run watch --exit-status does not end as "cancelled", and the main-only cache
# save is not lost.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: cargo fmt --check
        run: cargo fmt --all --check

  standalone-gate:
    name: Standalone gate (no fnp_ references)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Fail on fnp_ references (PRD-0002 FR-01)
        run: |
          set +e
          git grep -n -I -e 'fnp_' -- Cargo.toml ':(glob)crates/**/Cargo.toml' ':(glob)crates/**/*.rs'
          status=$?
          set -e
          case "$status" in
            0)
              echo "::error title=Standalone-Gate verletzt::Die Engine referenziert Spiel-Code (fnp_). Grimoire muss ohne das Spiel bauen und testen (PRD-0002 FR-01)."
              exit 1
              ;;
            1)
              echo "Keine fnp_-Referenzen in Cargo.toml oder crates/ gefunden."
              ;;
            *)
              echo "::error title=Standalone-Gate defekt::git grep ist mit Status ${status} fehlgeschlagen."
              exit "$status"
              ;;
          esac

  docs:
    name: rustdoc (deny warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Engine ADR-0006 building block 6: no crate with the determinism clippy.toml depends on rayon,
      # rayon-core or grimoire_exec (normal, build or dev, all targets); the clippy.toml stay identical.
      - name: Determinism crates do not depend on rayon (engine ADR-0006)
        run: bash .github/scripts/check-thread-source.sh
      # Contract §1 / engine ADR-0008: every grimoire_* edge (normal, build, dev) is on the crate map
      # allowlist. The self-test runs synthetic edges first, so a broken check cannot pass silently.
      - name: Self-test the crate map check
        run: bash .github/scripts/check-crate-map.sh --self-test
      - name: Crate dependencies follow the crate map (contract §1, engine ADR-0008)
        run: bash .github/scripts/check-crate-map.sh
      # Every CI script is parsed before it can run on main. The trend-publishing script only
      # runs on push to main, so a parse error in it passed every pull request until now.
      - name: CI shell scripts parse
        run: |
          status=0
          for script in .github/scripts/*.sh; do
            if bash -n "$script"; then
              echo "ok: $script"
            else
              echo "::error title=Shell-Syntaxfehler::$script"
              status=1
            fi
          done
          exit $status
      # Project ADR-0011 (schema codegen), Plan-0002 WP8.1: regenerates the debug-protocol and
      # pack-manifest Rust types/codecs and their docs/formats/*.md pages from schema/*.gschema
      # and fails if that changes anything the previous step didn't already catch as a checked-in
      # file (contract §12/§13).
      - name: Generated schema code is current (project ADR-0011, WP8.1)
        run: bash .github/scripts/check-schemagen-drift.sh
      - name: cargo doc
        run: cargo doc --workspace --no-deps --locked

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Lavapipe gives Linux a software Vulkan adapter and Windows runners have WARP, so a missing
      # adapter fails the GPU tests there. macOS runners may lack Metal: the tests skip with a
      # ::warning:: line in the log.
      - name: Install software Vulkan (lavapipe)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Feature `fixtures` (contract §9.2) is non-default, so the workspace clippy run above never
      # sees `grimoire::fixtures` (the player proxy, §9.5); a dedicated, all-features run is the
      # only way to lint it (Umsetzung WP1.3).
      - name: Clippy (grimoire, feature fixtures)
        run: cargo clippy -p grimoire --all-targets --all-features --locked -- -D warnings
      # rust-cache restores target/; drop probes from older runs so the artifact is this run's.
      - name: Remove stale float probes
        run: rm -rf target/float-probe
      # --no-fail-fast: a red test binary must not stop the float probes and golden tests of the
      # binaries after it (engine ADR 0004).
      # Piped through tee (not just run) so the "Report GPU adapter" step below can grep the
      # grimoire-gpu-adapter:/grimoire-gpu-tests-skipped: lines back out (WP2.1); `defaults.run.shell:
      # bash` runs with -o pipefail, so a red cargo test still fails this step.
      - name: Test
        env:
          GRIMOIRE_REQUIRE_GPU_ADAPTER: ${{ runner.os == 'macOS' && '0' || '1' }}
        run: |
          mkdir -p ci-logs
          cargo test --workspace --locked --no-fail-fast 2>&1 | tee ci-logs/test.log
      # `cargo test --workspace` silently skips tests behind the non-default `fixtures` feature
      # (`tests/player_proxy.rs`, `required-features = ["fixtures"]`); contract §9.2 requires this
      # dedicated step so the player proxy (§9.5) is actually exercised in CI (Umsetzung WP1.3).
      - name: Test (grimoire, feature fixtures)
        run: cargo test -p grimoire --features fixtures --locked --no-fail-fast
      # Local test runs force the CPU adapter; prove that path (WARP on Windows, lavapipe on Linux).
      # macOS has no CPU adapter. --workspace keeps the feature resolution of the Test step, so the
      # wgpu build is reused instead of compiled again.
      - name: Test offscreen rendering on the CPU adapter
        if: runner.os != 'macOS'
        env:
          GRIMOIRE_GPU_ADAPTER: software
          GRIMOIRE_REQUIRE_GPU_ADAPTER: "1"
        run: |
          mkdir -p ci-logs
          cargo test --workspace --test offscreen --locked 2>&1 | tee ci-logs/test-offscreen-cpu.log
      # CI-Render-Ehrlichkeit (WP2.1, Vorstufe OF-18.2): adapter name/backend/device type per runner
      # and the count of GPU tests skipped for lack of an adapter, into this job's summary. Runs
      # even if a Test step above failed, so a red run still says what it rendered on.
      - name: Report GPU adapter and skipped GPU tests
        if: ${{ !cancelled() }}
        env:
          RUNNER_LABEL: ${{ matrix.os }}
        run: bash .github/scripts/report-gpu-adapter.sh "$RUNNER_LABEL" ci-logs/test.log ci-logs/test-offscreen-cpu.log
      # WP3.1 downlevel check ahead of WP3.4 (clustered forward+): proves the local dev workflow's
      # forced software adapter (see the offscreen step above) also runs the two functional-proof
      # pipelines in `grimoire_gpu`'s `tests/downlevel.rs` (a fragment shader reading a storage
      # buffer, a compute pass writing one). macOS has no CPU adapter, so its downlevel numbers
      # come from the auto-selected adapter already exercised in the "Test" step above instead
      # (same reasoning as the offscreen step).
      - name: Test WP3.1 downlevel capability probe on the CPU adapter
        if: runner.os != 'macOS'
        env:
          GRIMOIRE_GPU_ADAPTER: software
          GRIMOIRE_REQUIRE_GPU_ADAPTER: "1"
        run: |
          mkdir -p ci-logs
          cargo test --workspace --test downlevel --locked 2>&1 | tee ci-logs/test-downlevel-cpu.log
      # Features, downlevel flags and limits the adapter actually reported, per runner, plus how
      # many WP3.1 tests skipped for lack of an adapter or capability. Runs even if a Test step
      # above failed, so a red run still says what it measured.
      - name: Report WP3.1 downlevel capabilities
        if: ${{ !cancelled() }}
        env:
          RUNNER_LABEL: ${{ matrix.os }}
        run: bash .github/scripts/report-gpu-downlevel.sh "$RUNNER_LABEL" ci-logs/test.log ci-logs/test-downlevel-cpu.log
      # Plan 0002 WP2.8: the three deterministic render test scenes (`pbr_materials`, `shadows`,
      # `camera_tilt`), rendered on the software adapter and compared against a per-platform
      # reference in WARNING MODE (a mismatch is reported, never fails this step — see
      # `crates/grimoire_render/tests/snapshot_scenes.rs`'s module doc comment, "Warning mode", for
      # how that becomes failing). Run on every OS, including macOS: that runner currently resolves
      # `GRIMOIRE_GPU_ADAPTER=software` to no adapter at all (PRD-0018's adapter table; the same
      # module doc comment explains why), which this step's own "no reference"/skip reporting
      # already covers cleanly, so there is nothing macOS-specific to special-case here.
      # Plan 0002 WP6.4 adds the scene `overlay` (the facade's stats overlay,
      # `crates/grimoire/tests/overlay_scene.rs`), compared the same way and reported in the same
      # log; `--workspace` keeps the Test step's feature resolution, like the offscreen step.
      # Candidates go to one absolute directory: each test binary runs in its own package
      # directory, so the relative default `target/wp28-snapshots` never reached the upload below.
      - name: Render WP2.8 deterministic test scenes
        env:
          GRIMOIRE_GPU_ADAPTER: software
          GRIMOIRE_SNAPSHOT_CANDIDATE_DIR: ${{ github.workspace }}/target/wp28-snapshots
        run: |
          mkdir -p ci-logs
          cargo test -p grimoire_render --test snapshot_scenes --locked -- --ignored --nocapture 2>&1 | tee ci-logs/test-snapshot-scenes.log
          cargo test --workspace --test overlay_scene --locked -- --ignored --nocapture 2>&1 | tee -a ci-logs/test-snapshot-scenes.log
      # Plan 0002 WP3.6, OF-18.2: macOS has no software adapter, so the scene step above skips every
      # scene there. This step measures the variance of every scene on the runner's own Metal
      # device instead (GRIMOIRE_GPU_ADAPTER unset), compared with the Windows references; it only
      # reports, like the warning mode.
      - name: Measure OF-18.2 scene variance on Metal
        if: ${{ runner.os == 'macOS' }}
        run: |
          mkdir -p ci-logs
          cargo test --workspace --test snapshot_scenes --locked -- --ignored --nocapture scene_variance 2>&1 | tee ci-logs/test-scene-variance-metal.log
      - name: Report WP2.8 snapshot scene results
        if: ${{ !cancelled() }}
        env:
          RUNNER_LABEL: ${{ matrix.os }}
        run: bash .github/scripts/report-snapshot-diff.sh "$RUNNER_LABEL" ci-logs/test-snapshot-scenes.log ci-logs/test-scene-variance-metal.log
      # Populated only when a scene had no reference yet or mismatched one: lets a
      # human pull down what the software adapter actually produced on this runner to review and,
      # if it looks right, commit as that platform's new reference.
      - name: Upload WP2.8 snapshot candidates
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-candidates-${{ matrix.os }}
          path: target/wp28-snapshots/
          if-no-files-found: ignore
          retention-days: 14
      # Examples open windows: build them, never run them in CI. The milestone-showcase example
      # `pbr_stage` (plan 0002 WP2.8) is covered here too, build-only like every other example.
      - name: Build examples
        run: cargo build --workspace --examples --locked
      - name: Upload float probe
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: float-probe-${{ matrix.os }}
          path: target/float-probe/
          if-no-files-found: error
          retention-days: 14
      # Plan 0002 WP4.4, platform identity gate: this runner's `sigilc` (debug, already built by the
      # test step) compiles the Sigil corpus, the reference patterns and the facade's unit fixtures;
      # `sigil-identity` compares the bytes across all three operating systems. Runs after a red
      # test step too, so a test failure does not hide a compiler difference.
      - name: Build Sigil units (WP4.4)
        if: ${{ !cancelled() }}
        run: bash .github/scripts/build-sigil-units.sh target/sigil-units
      - name: Upload Sigil units
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: sigil-units-${{ matrix.os }}
          path: target/sigil-units/
          if-no-files-found: error
          retention-days: 14

  float-compare:
    name: Float probe comparison
    needs: test
    # Compare whatever probes exist, even if one OS failed its tests.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - name: Download float probes
        # A run without any probe must still reach the comparison step, which reports it.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: float-probe-*
          # Flat layout for any number of matches (a single match is never nested).
          merge-multiple: true
          path: float-probe
      - name: Self-test the float probe comparison
        run: bash .github/scripts/test-compare-float-probes.sh
      - name: Compare float probes across operating systems
        env:
          # Missing core probes fail the comparison only if every test job succeeded.
          TESTS_RESULT: ${{ needs.test.result }}
        run: bash .github/scripts/compare-float-probes.sh float-probe "Debug-Build"

  sigil-identity:
    name: Sigil unit identity (WP4.4)
    needs: test
    # Compare whatever units exist, even if one OS failed its tests.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      # One directory per operating system, downloaded by name; a missing artifact must still reach
      # the comparison step, which reports it.
      - name: Download Sigil units (windows-latest)
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: sigil-units-windows-latest
          path: sigil-units/windows-latest
      - name: Download Sigil units (ubuntu-latest)
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: sigil-units-ubuntu-latest
          path: sigil-units/ubuntu-latest
      - name: Download Sigil units (macos-latest)
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: sigil-units-macos-latest
          path: sigil-units/macos-latest
      - name: Self-test the Sigil unit comparison
        run: bash .github/scripts/test-compare-sigil-units.sh
      - name: Compare Sigil units across operating systems
        env:
          # Missing artifacts fail the comparison only if every test job succeeded.
          TESTS_RESULT: ${{ needs.test.result }}
        run: bash .github/scripts/compare-sigil-units.sh sigil-units "Debug-Build"

  showcase-gif:
    name: Showcase GIFs (pbr_stage, lights_stage, sigil_curtain)
    # Plan 0002 WP2.8 milestone showcase: renders the merged stage (meshes, PBR materials, lights,
    # the key-light shadow map, the tilted camera — the same cast as the `pbr_stage` example, which
    # this job never runs itself, only builds via the `test` job's "Build examples" step) offscreen
    # as a PNG sequence and assembles it into a GIF artifact
    # (`crates/grimoire_render/tests/pbr_stage_showcase.rs`).
    # Plan 0002 WP3.7 adds the M2 showcase `lights_stage` the same way: 240 point lights through
    # clustered forward+ at the High budget, bullets with glow and the player marker on the ground,
    # rendered from the example's own `scene.rs` (`tests/lights_stage_showcase.rs`) into the
    # artifact `lights_stage-showcase-gif`.
    # Plan 0002 WP5.7 adds the M2 showcase `sigil_curtain` the same way: a sigilc-compiled Sigil
    # pattern run by the interpreter in the facade's main loop and drawn by the bullet pass, from the
    # example's `scene.rs` (`crates/grimoire/tests/sigil_curtain_showcase.rs`) into the artifact
    # `sigil_curtain-showcase-gif`.
    #
    # Kept cheap on purpose: one OS (`ubuntu-latest`, the cheapest GitHub-hosted
    # runner) instead of the three-OS matrix `test` uses — a GIF is a showcase artifact, not a
    # per-platform correctness check, so running it three times would triple the cost for no
    # additional information (`snapshot_scenes.rs`'s per-platform references already cover
    # per-platform rendering correctness) — and skipped on pull requests entirely: a milestone GIF
    # is worth refreshing on every merge to `main`, not worth paying for on every review iteration
    # of a pull request. `workflow_dispatch` can still run it on demand (for example to refresh the
    # GIF after a purely visual tweak that does not otherwise touch `main`).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The showcase test writes relative to its own working directory (the package root under
    # cargo test), while the shell steps run at the repository root, so a relative path pointed the
    # two at different places. One absolute directory, passed through env (never interpolated into
    # a run block), keeps every step in this job on the same files.
    env:
      GRIMOIRE_PBR_STAGE_GIF_OUT_DIR: ${{ github.workspace }}/pbr-stage-gif
      GRIMOIRE_LIGHTS_STAGE_GIF_OUT_DIR: ${{ github.workspace }}/lights-stage-gif
      GRIMOIRE_SIGIL_CURTAIN_GIF_OUT_DIR: ${{ github.workspace }}/sigil-curtain-gif
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Same reasoning as the `test` job: lavapipe gives this runner a software Vulkan adapter.
      # ffmpeg is installed here rather than assumed: it is not part of the `ubuntu-latest` image,
      # and this job's first run on `main` died with "ffmpeg: command not found" (exit 127).
      - name: Install software Vulkan (lavapipe) and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers ffmpeg
      # `pbr_stage_showcase.rs`'s renderer helper does not read `GRIMOIRE_REQUIRE_GPU_ADAPTER`
      # (unlike `tests/offscreen.rs`): a missing adapter here would just mean an empty artifact, so
      # a hard failure (via `set -e` and no GPU) is the honest outcome rather than a silent skip.
      - name: Render the pbr_stage PNG sequence
        env:
          GRIMOIRE_GPU_ADAPTER: software
        run: |
          cargo test -p grimoire_render --test pbr_stage_showcase --locked -- --ignored --nocapture render_pbr_stage_png_sequence
          test -f "$GRIMOIRE_PBR_STAGE_GIF_OUT_DIR/frame_0000.png"
      # A two-pass palette (generate, then apply) keeps an 8-bit GIF from banding the PBR
      # spheres and gradients as badly as ffmpeg's default fixed palette would.
      - name: Assemble the PNG sequence into a GIF
        run: |
          palette="$(mktemp --suffix=.png)"
          ffmpeg -y -framerate 24 -i "$GRIMOIRE_PBR_STAGE_GIF_OUT_DIR/frame_%04d.png" \
            -vf "palettegen" "$palette"
          ffmpeg -y -framerate 24 -i "$GRIMOIRE_PBR_STAGE_GIF_OUT_DIR/frame_%04d.png" -i "$palette" \
            -lavfi "paletteuse" pbr_stage.gif
          ls -la pbr_stage.gif
      - name: Upload the showcase GIF
        uses: actions/upload-artifact@v7
        with:
          name: pbr_stage-showcase-gif
          path: pbr_stage.gif
          if-no-files-found: error
          retention-days: 30
      # Plan 0002 WP3.7: the lights_stage showcase, same technique as pbr_stage above.
      - name: Render the lights_stage PNG sequence
        env:
          GRIMOIRE_GPU_ADAPTER: software
        run: |
          cargo test -p grimoire_render --test lights_stage_showcase --locked -- --ignored --nocapture render_lights_stage_png_sequence
          test -f "$GRIMOIRE_LIGHTS_STAGE_GIF_OUT_DIR/frame_0000.png"
      - name: Assemble the lights_stage PNG sequence into a GIF
        run: |
          palette="$(mktemp --suffix=.png)"
          ffmpeg -y -framerate 24 -i "$GRIMOIRE_LIGHTS_STAGE_GIF_OUT_DIR/frame_%04d.png" \
            -vf "palettegen" "$palette"
          ffmpeg -y -framerate 24 -i "$GRIMOIRE_LIGHTS_STAGE_GIF_OUT_DIR/frame_%04d.png" -i "$palette" \
            -lavfi "paletteuse" lights_stage.gif
          ls -la lights_stage.gif
      - name: Upload the lights_stage showcase GIF
        uses: actions/upload-artifact@v7
        with:
          name: lights_stage-showcase-gif
          path: lights_stage.gif
          if-no-files-found: error
          retention-days: 30
      # Plan 0002 WP5.7: the sigil_curtain showcase, same technique again. The sequence test panics
      # without an adapter, and the last-frame check fails on a short or empty sequence.
      - name: Render the sigil_curtain PNG sequence
        env:
          GRIMOIRE_GPU_ADAPTER: software
        run: |
          cargo test -p grimoire --test sigil_curtain_showcase --locked -- --ignored --nocapture render_sigil_curtain_png_sequence
          test -f "$GRIMOIRE_SIGIL_CURTAIN_GIF_OUT_DIR/frame_0071.png"
      - name: Assemble the sigil_curtain PNG sequence into a GIF
        run: |
          palette="$(mktemp --suffix=.png)"
          ffmpeg -y -framerate 24 -i "$GRIMOIRE_SIGIL_CURTAIN_GIF_OUT_DIR/frame_%04d.png" \
            -vf "palettegen" "$palette"
          ffmpeg -y -framerate 24 -i "$GRIMOIRE_SIGIL_CURTAIN_GIF_OUT_DIR/frame_%04d.png" -i "$palette" \
            -lavfi "paletteuse" sigil_curtain.gif
          ls -la sigil_curtain.gif
      - name: Upload the sigil_curtain showcase GIF
        uses: actions/upload-artifact@v7
        with:
          name: sigil_curtain-showcase-gif
          path: sigil_curtain.gif
          if-no-files-found: error
          retention-days: 30
