# C# tooling suite under tools/ (Plan 0002 WP9.1, PO decision P-1): restore, build and test the
# solution on Windows, Linux and macOS with the SDK pinned in tools/global.json.
# Runs only when something the suite builds from or tests against changes: its own sources, the schemas
# its codecs are generated from, the workspace version it reads, and the engine's golden fixtures its
# conformance tests read. The generated C# itself is kept current by ci.yml's drift check.
# Every run that is triggered is watched until it finishes:
#   gh run watch <id> --exit-status        (red run: gh run view <id> --log-failed)
name: Tools (.NET)

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "schema/**"
      - "Cargo.toml"
      - "crates/grimoire_debug/tests/fixtures/**"
      - "crates/grimoire_debug/tests/handshake_golden.rs"
      - "crates/grimoire_assets/tests/fixtures/**"
      - ".github/workflows/tools.yml"
  pull_request:
    paths:
      - "tools/**"
      - "schema/**"
      - "Cargo.toml"
      - "crates/grimoire_debug/tests/fixtures/**"
      - "crates/grimoire_debug/tests/handshake_golden.rs"
      - "crates/grimoire_assets/tests/fixtures/**"
      - ".github/workflows/tools.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  # Contract §13 "Socket-Tests": real loopback sockets only in CI, never on the development machine.
  GRIMOIRE_SOCKET_TESTS: "1"

defaults:
  run:
    shell: bash
    working-directory: tools

jobs:
  dotnet:
    name: dotnet build/test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Installs exactly the SDK of tools/global.json; the NuGet cache is keyed on the lock files.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: tools/global.json
          cache: true
          cache-dependency-path: tools/**/packages.lock.json
      - name: SDK in use
        run: dotnet --version
      - name: Restore (locked mode)
        run: dotnet restore Grimoire.Tools.slnx --locked-mode
      - name: Build (warnings are errors)
        run: dotnet build Grimoire.Tools.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test --solution Grimoire.Tools.slnx --no-build --configuration Release
