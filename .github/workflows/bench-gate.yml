# Benchmark gate (Plan-0002 WP6.2, engine ADR-0010): builds and runs the two P0 baseline benches
# (`ecs_query_10k`, `sim_step_600`), since Plan-0002 WP5.3 the Sigil -> Render extraction bench
# (`sigil_extract_10k`) and since WP5.4 the Sigil tick benches (`sigil_update_6k`,
# `sigil_update_10k`, `sigil_churn_2k`; their wall-clock medians per tick are printed against the
# 1.0 ms budget as a trend line) and since WP3.6 the render CPU benches (`render_bullet_upload_10k`,
# `render_light_cluster_256`) under Callgrind on every push to main and every pull request,
# compares the Callgrind `Ir` result against the accepted basis on the `bench-trends` branch
# (P-12), and — on push to main only — appends the measurement to that same branch. Wall-clock
# samples are measured too, but only as a trend (engine ADR-0010: measured 95-129% job-to-job
# noise on shared Linux runners, unusable as a >10% gate); they are never compared or gated.
#
# HARD MODE (since plan 0002 M2, see engine ADR-0010's M2 addendum): a red verdict (`compare` exit
# code 3, more than +10% Ir on any scenario with an accepted basis) fails job `gate`'s "Evaluate
# gate verdict" step. `env.BENCH_GATE_MODE` below is the one switch; `warn` would only annotate a
# red verdict again. A measurement error (`compare` exit code 2 — e.g. a zero Ir reading, or a
# candidate whose own JSON is invalid) or any other unexpected exit code fails the job in both
# modes. A scenario without an accepted basis gets no verdict and never fails (a new bench can only
# be accepted from a commit on main); `bench-accept-baseline` brings it under the gate.
#
# Job `regression-proof` proves on every run, and nightly, that the switch works: a calibrated,
# real +15% regression injected into two benches (GRIMOIRE_BENCH_INJECT_REGRESSION=1) fails the
# exact evaluation the `gate` job runs in HARD MODE, while +5% and a repeat measurement do not.
#
# Every push that triggers this workflow is watched until it finishes:
#   gh run watch --exit-status        (red run: gh run view --log-failed)
name: Benchmark gate

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  # Nightly on main (plan 0002 WP6.2: the self-test job runs "manually and nightly"), so a runner
  # change that breaks the measurement or the proof shows up without waiting for the next push.
  # `publish-trend` stays push-only.
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:

# One gate run per ref at a time; PR runs are superseded by a newer push, main runs never are
# (every main commit gets a verdict, and the trend-branch append must not be skipped).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default: read-only. Only the `publish-trend` job (push to main only) elevates to `contents:
# write`, scoped to that one job, per this task's own rule ("give write permission only to that
# job").
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The gate mode switch (see header comment above). Valid values: "warn", "hard".
  BENCH_GATE_MODE: hard

defaults:
  run:
    shell: bash

jobs:
  # Builds the bench binaries once, measures both benches (wall-clock trend + Callgrind Ir gate),
  # runs the comparator's synthetic self-test, and evaluates the gate verdict against the accepted
  # basis. Single job (not a repetition matrix, unlike the WP6.1 noise spike): engine ADR-0010
  # already proved Ir's job-to-job and run-to-run noise band is exactly 0% for these two benches
  # on ubuntu-24.04, so a production run only needs the one real measurement, keeping this job
  # modest alongside the rest of this repo's CI.
  gate:
    name: gate (build, measure, compare)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      compare-exit-code: ${{ steps.evaluate.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build bench binaries
        run: cargo build --release --locked -p grimoire_bench --bins
      - name: Fingerprint
        run: |
          {
            echo "RUNNER_OS_LOWER=linux"
            echo "RUNNER_ARCH_LOWER=x86_64"
            echo "RUNNER_IMAGE=ubuntu-24.04"
            echo "CPU_MODEL=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p')"
            echo "LOGICAL_CPUS=$(nproc)"
          } >>"$GITHUB_ENV"
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "GIT_DIRTY=1" >>"$GITHUB_ENV"
          else
            echo "GIT_DIRTY=0" >>"$GITHUB_ENV"
          fi
      - name: Wall-clock trend measurement (trend only, never gated)
        run: |
          mkdir -p results
          DIRTY_FLAG=()
          if [[ "$GIT_DIRTY" == "1" ]]; then DIRTY_FLAG=(--dirty); fi
          ./target/release/wallclock --sha "$GITHUB_SHA" "${DIRTY_FLAG[@]}" \
            --os "$RUNNER_OS_LOWER" --arch "$RUNNER_ARCH_LOWER" --image "$RUNNER_IMAGE" \
            --cpu-model "$CPU_MODEL" --logical-cpus "$LOGICAL_CPUS" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            >results/wallclock.jsonl
      - name: Instruction-count measurement (Callgrind Ir, the gate metric)
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          bash crates/grimoire_bench/scripts/measure_ir.sh \
            ./target/release/ir_probe ./target/release/bench_result \
            results/ir.jsonl cg-out
      - name: Comparator self-test (synthetic inputs; always required, independent of WARN/HARD mode)
        run: ./target/release/compare --self-test | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Fetch accepted basis (bench-trends, P-12)
        run: |
          mkdir -p basis
          if git fetch origin bench-trends 2>/dev/null; then
            git show origin/bench-trends:accepted-basis.jsonl >basis/accepted-basis.jsonl 2>/dev/null \
              || : >basis/accepted-basis.jsonl
          else
            : >basis/accepted-basis.jsonl
          fi
      # The same script `regression-proof` runs on an injected regression, so what that job proves
      # is exactly what this step does.
      - name: Evaluate gate verdict (BENCH_GATE_MODE, see header comment)
        id: evaluate
        run: |
          bash .github/scripts/evaluate-bench-gate.sh results/ir.jsonl basis/accepted-basis.jsonl \
            "$BENCH_GATE_MODE" ./target/release/compare
      - name: Upload bench results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-gate-results
          path: |
            results/
            basis/
          if-no-files-found: error
          retention-days: 30

  # Calibrates the regression injector fresh on this runner (engine ADR-0010: the per-unit slope
  # is bench- and host-dependent, so this task's own calibration unit counts are never copied from
  # a prior measurement, including the ADR's own table) and proves +5% never gates red while
  # +15%/+20% always do — the negative proof this task's scope calls for, backed by a real
  # Callgrind measurement rather than only a unit test on synthetic numbers. Independent of `gate`
  # (own build): both run in parallel, keeping wall time down without sharing mutable state.
  calibration-proof:
    name: calibration proof (+15% detected, engine ADR-0010)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .
          save-if: false
      - name: Build bench binaries
        run: cargo build --release --locked -p grimoire_bench --bins
      - name: Calibrate ecs_query_10k
        run: |
          mkdir -p results
          bash crates/grimoire_bench/scripts/calibrate_injection.sh ./target/release/ir_probe ecs \
            results/calibration-ecs.jsonl cg-out-calibration
      - name: Calibrate sim_step_600
        run: |
          bash crates/grimoire_bench/scripts/calibrate_injection.sh ./target/release/ir_probe sim \
            results/calibration-sim.jsonl cg-out-calibration
      - name: Calibration check (accuracy within +/-1pp; +15%/+20% red, +5% not red)
        run: ./target/release/calibration_check results | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload calibration results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-gate-calibration
          path: results/
          if-no-files-found: error
          retention-days: 30

  # The self-test job of plan 0002 WP6.2 ("negative proof") and M2 ("the self-test job proves the
  # break"): proves end to end, on real Callgrind measurements of this very commit, that a
  # regression fails the HARD MODE gate. It calibrates the injection fresh (like
  # `calibration-proof`), measures every bench twice without injection (basis and repeat) and twice
  # with GRIMOIRE_BENCH_INJECT_REGRESSION=1 (+5% and +15% on `ecs_query_10k` and `sim_step_600`),
  # then runs `.github/scripts/evaluate-bench-gate.sh` — the script of the `gate` job — in HARD MODE
  # against the uninjected basis (`.github/scripts/prove-bench-gate.sh`). The job is green only if
  # +15% fails that evaluation with exactly the two injected scenarios red, while +5% (warnings)
  # and the repeat (all green) pass. Runs on every trigger, so also manually and nightly.
  regression-proof:
    name: regression proof (injected +15% fails the hard gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .
          save-if: false
      - name: Build bench binaries
        run: cargo build --release --locked -p grimoire_bench --bins
      - name: Calibrate the injection (ecs_query_10k, sim_step_600)
        run: |
          mkdir -p proof
          bash crates/grimoire_bench/scripts/calibrate_injection.sh ./target/release/ir_probe ecs \
            proof/calibration-ecs.jsonl cg-out-calibration
          bash crates/grimoire_bench/scripts/calibrate_injection.sh ./target/release/ir_probe sim \
            proof/calibration-sim.jsonl cg-out-calibration
      - name: Measure without injection (basis and repeat)
        run: |
          bash crates/grimoire_bench/scripts/measure_ir.sh ./target/release/ir_probe \
            ./target/release/bench_result proof/basis.jsonl cg-out-basis
          bash crates/grimoire_bench/scripts/measure_ir.sh ./target/release/ir_probe \
            ./target/release/bench_result proof/repeat.jsonl cg-out-repeat
      - name: Measure with GRIMOIRE_BENCH_INJECT_REGRESSION=1 (+5% and +15%)
        env:
          GRIMOIRE_BENCH_INJECT_REGRESSION: "1"
          GRIMOIRE_BENCH_INJECT_CALIBRATION: proof
        run: |
          GRIMOIRE_BENCH_INJECT_PERCENT=5 bash crates/grimoire_bench/scripts/measure_ir.sh \
            ./target/release/ir_probe ./target/release/bench_result proof/plus5.jsonl cg-out-plus5
          GRIMOIRE_BENCH_INJECT_PERCENT=15 bash crates/grimoire_bench/scripts/measure_ir.sh \
            ./target/release/ir_probe ./target/release/bench_result proof/plus15.jsonl cg-out-plus15
      - name: Prove the HARD MODE verdicts (+15% fails; +5% and repeat pass)
        run: bash .github/scripts/prove-bench-gate.sh ./target/release/compare proof
      - name: Upload regression proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-gate-regression-proof
          path: proof/
          if-no-files-found: error
          retention-days: 30

  # Appends this run's BenchResult lines (wall-clock trend + Ir) to bench-trends (P-12). Push to
  # main only, and only if `gate` produced a valid measurement: it succeeded, or it failed only
  # because the verdict was red (compare exit code 3). A red verdict still enters the trend, so a
  # regression merged on purpose can be accepted as the new basis (`bench-accept-baseline` needs
  # the commit on bench-trends); a failed measurement never does. The first push to main after the
  # gate was introduced created `bench-trends` (an orphan branch, never sharing history with main)
  # — see `.github/scripts/append-bench-trend.sh`.
  publish-trend:
    name: publish trend (bench-trends, P-12)
    needs: gate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !cancelled() && (needs.gate.result == 'success' || needs.gate.outputs.compare-exit-code == '3') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download bench results
        uses: actions/download-artifact@v8
        with:
          name: bench-gate-results
          path: downloaded
      - name: Merge wall-clock and Ir results into one file
        run: cat downloaded/results/wallclock.jsonl downloaded/results/ir.jsonl >combined-results.jsonl
      - name: Append to bench-trends
        run: bash .github/scripts/append-bench-trend.sh combined-results.jsonl "$GITHUB_SHA"
