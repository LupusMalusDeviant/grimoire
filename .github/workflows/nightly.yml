# Nightly engine run: release-mode test suite and Sigil unit identity gate on all three operating
# systems.
# Scheduled runs are skipped when main had no commits in the last 24 hours.
name: Nightly

on:
  schedule:
    # 02:17 UTC, off the full hour to avoid scheduler congestion.
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Contract §8.1: the engine build hash of every replay v2 this build records (ENGINE_BUILD, read
  # at compile time). Local builds and cargo git checkouts leave it unset and record UNKNOWN.
  GRIMOIRE_BUILD_HASH: ${{ github.sha }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Commits in the last 24 hours?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      # Decides on when main last MOVED (pushes and merges from the repository activity API), not
      # on commit dates: a commit made days ago and pushed today still counts as a change.
      - name: Did main change in the last 24 hours?
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "Manueller Start: Nightly laeuft unabhaengig von Aenderungen."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if count=$(gh api "repos/${GITHUB_REPOSITORY}/activity?ref=refs/heads/main&time_period=day&per_page=100" \
                --jq '[.[] | select(.activity_type != "branch_deletion")] | length') \
             && [[ "$count" =~ ^[0-9]+$ ]]; then
            echo "Aenderungen an main in den letzten 24 Stunden (Aktivitaets-API): ${count}"
          else
            # Fallback: committer date of HEAD (misses commits that were pushed long after creation).
            echo "::warning title=Aktivitaets-API nicht verfuegbar::Entscheidung ueber das Committer-Datum von HEAD."
            age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
            count=$(( age < 86400 ? 1 : 0 ))
          fi
          if [ "$count" -gt 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Nightly uebersprungen::Keine Aenderungen an main in den letzten 24 Stunden."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  test-release:
    name: release tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install software Vulkan (lavapipe)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - name: Remove stale float probes
        run: rm -rf target/float-probe
      - name: Test (release)
        env:
          # WARP (Windows) and lavapipe (Linux) guarantee an adapter; macOS may skip with a warning.
          GRIMOIRE_REQUIRE_GPU_ADAPTER: ${{ runner.os == 'macOS' && '0' || '1' }}
        # --no-fail-fast: a red test binary must not stop the probes and golden tests after it.
        run: cargo test --workspace --release --locked --no-fail-fast
      - name: Upload float probe
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: float-probe-release-${{ matrix.os }}
          path: target/float-probe/
          if-no-files-found: error
          retention-days: 14
      # Plan 0002 WP4.4 with a release-built `sigilc`: optimisation must not change a single unit byte
      # either (the pull request CI covers the debug build).
      - name: Build Sigil units (WP4.4, release)
        if: ${{ !cancelled() }}
        env:
          SIGILC_PROFILE: release
        run: bash .github/scripts/build-sigil-units.sh target/sigil-units
      - name: Upload Sigil units
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: sigil-units-release-${{ matrix.os }}
          path: target/sigil-units/
          if-no-files-found: error
          retention-days: 14

  float-compare:
    name: Float probe comparison (release)
    needs: [changes, test-release]
    if: ${{ !cancelled() && needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - name: Download float probes
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: float-probe-release-*
          # Flat layout for any number of matches (a single match is never nested).
          merge-multiple: true
          path: float-probe
      - name: Compare float probes across operating systems
        env:
          # Missing core probes fail the comparison only if every test job succeeded.
          TESTS_RESULT: ${{ needs.test-release.result }}
        run: bash .github/scripts/compare-float-probes.sh float-probe "Release-Build (Nightly)"

  sigil-identity:
    name: Sigil unit identity (WP4.4, release)
    needs: [changes, test-release]
    if: ${{ !cancelled() && needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - name: Download Sigil units (windows-latest)
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: sigil-units-release-windows-latest
          path: sigil-units/windows-latest
      - name: Download Sigil units (ubuntu-latest)
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: sigil-units-release-ubuntu-latest
          path: sigil-units/ubuntu-latest
      - name: Download Sigil units (macos-latest)
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: sigil-units-release-macos-latest
          path: sigil-units/macos-latest
      - name: Compare Sigil units across operating systems
        env:
          # Missing artifacts fail the comparison only if every test job succeeded.
          TESTS_RESULT: ${{ needs.test-release.result }}
        run: bash .github/scripts/compare-sigil-units.sh sigil-units "Release-Build (Nightly)"
