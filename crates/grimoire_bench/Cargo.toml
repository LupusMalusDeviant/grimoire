[package]
name = "grimoire_bench"
description = "Benchmarks and JSON-schema types for bench results and golden masters (contract §15); outside the determinism set, no clippy.toml by design."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license-file.workspace = true
publish.workspace = true

# May depend on any runtime crate and on grimoire_exec (contract §1); nothing depends on it.
# WP6.2 (plan 0002) adds the P0 baseline benches (`ecs_query_10k`, `sim_step_600`) plus the JSON
# schema types for bench results (contract §15.1). Those two benches only exercise ECS queries
# and one simulation step, so this depends on `grimoire_ecs`, `grimoire_sim` and `grimoire_core`
# directly rather than on the `grimoire` facade: the facade also pulls in `grimoire_render`,
# `grimoire_gpu`, `grimoire_platform`, `grimoire_collide`, `grimoire_assets` and `grimoire_debug`,
# none of which any bench touches, and the crate map (contract §1) permits any runtime crate, not
# specifically the facade — pulling in the whole facade here would cost CI build time (OP-5) for
# no coverage gained. `grimoire_exec` is not yet a dependency: WP6.2's two P0 benches and WP5.1's
# `sigil_update_6k` are single-threaded (engine ADR-0010 scopes the Callgrind gate to
# single-threaded benches; Valgrind serialises threads); an N-thread wall-clock trend bench would
# add it later. `grimoire_sigil` is a direct dependency since Plan 0002 WP5.1, for exactly one
# reason: `scenarios::sigil_update_6k` is the micro-bench WP5.1's plan requires ("Mikro-Bench
# belegt es") proving the `sigil.update` hot path calls no `dmath` trigonometry per bullet per
# tick — see that module's doc comment for what it measures and what still needs doing to turn it
# into a gated CI check (contract §15, engine ADR-0010).
# The `grimoire` facade is a direct dependency since Plan 0002 WP5.3, for exactly one reason:
# `scenarios::build_sigil_extract` measures the Sigil -> Render extraction adapter
# (`grimoire::adapters::sigil_render`), which lives only in the facade (contract §9.1), against
# the plan's 0.5 ms budget for 10,000 bullets. This pulls the render stack into the bench build;
# the crate map (contract §1) permits any runtime crate here.
[dependencies]
grimoire.workspace = true
grimoire_core.workspace = true
grimoire_ecs.workspace = true
grimoire_sigil.workspace = true
grimoire_sim.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
