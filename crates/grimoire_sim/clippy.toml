    { path = "f64::log2", reason = "platform libm differs; simulation math is f32 via grimoire_core::math::dmath" },
    { path = "f64::log10", reason = "platform libm differs; simulation math is f32 via grimoire_core::math::dmath" },
    { path = "f64::sinh", reason = "platform libm differs; simulation math is f32 via grimoire_core::math::dmath" },
    { path = "f64::cosh", reason = "platform libm differs; simulation math is f32 via grimoire_core::math::dmath" },
    { path = "f64::tanh", reason = "platform libm differs; simulation math is f32 via grimoire_core::math::dmath" },
    { path = "f64::asinh", reason = "platform libm differs; simulation math is f32 via grimoire_core::math::dmath" },
    { path = "f64::acosh", reason = "platform libm differs; simulation math is f32 via grimoire_core::math::dmath" },
    { path = "f64::atanh", reason = "platform libm differs; simulation math is f32 via grimoire_core::math::dmath" },
