# Determinism lint (engine ADR on floating point, PRD-0018 FR-09).
# Simulation-side crates must not depend on wall-clock time, unordered hash containers or platform libm.
disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order is not deterministic; use BTreeMap or an ordered Vec" },
    { path = "std::collections::HashSet", reason = "iteration order is not deterministic; use BTreeSet or an ordered Vec" },
]
disallowed-methods = [
    { path = "std::time::Instant::now", reason = "wall-clock time must not influence simulation state; use the Tick resource" },
    { path = "std::time::SystemTime::now", reason = "wall-clock time must not influence simulation state; use the Tick resource" },
    { path = "f32::sin", reason = "platform libm differs; use grimoire_core::math::dmath::sin" },
    { path = "f32::cos", reason = "platform libm differs; use grimoire_core::math::dmath::cos" },
    { path = "f32::tan", reason = "platform libm differs; use grimoire_core::math::dmath::tan" },
    { path = "f32::asin", reason = "platform libm differs; use grimoire_core::math::dmath::asin" },
    { path = "f32::acos", reason = "platform libm differs; use grimoire_core::math::dmath::acos" },
    { path = "f32::atan", reason = "platform libm differs; use grimoire_core::math::dmath::atan" },
    { path = "f32::atan2", reason = "platform libm differs; use grimoire_core::math::dmath::atan2" },
    { path = "f32::exp", reason = "platform libm differs; use grimoire_core::math::dmath::exp" },
    { path = "f32::ln", reason = "platform libm differs; use grimoire_core::math::dmath::ln" },
    { path = "f32::powf", reason = "platform libm differs; use grimoire_core::math::dmath::powf" },
    { path = "f32::hypot", reason = "platform libm differs; use grimoire_core::math::dmath::hypot" },
    { path = "f32::mul_add", reason = "fused multiply-add is not used in simulation code" },
    { path = "f32::sin_cos", reason = "platform libm differs; use dmath::sin and dmath::cos" },
    { path = "f32::powi", reason = "precision is platform-dependent; multiply explicitly or use dmath::powf" },
    { path = "f32::exp2", reason = "platform libm differs; use dmath::powf(2.0, x)" },
    { path = "f32::exp_m1", reason = "platform libm differs; build it from dmath::exp" },
    { path = "f32::ln_1p", reason = "platform libm differs; build it from dmath::ln" },
    { path = "f32::log", reason = "platform libm differs; build it from dmath::ln" },
    { path = "f32::log2", reason = "platform libm differs; build it from dmath::ln" },
    { path = "f32::log10", reason = "platform libm differs; build it from dmath::ln" },
    { path = "f32::sinh", reason = "platform libm differs; build it from dmath::exp" },
    { path = "f32::cosh", reason = "platform libm differs; build it from dmath::exp" },
    { path = "f32::tanh", reason = "platform libm differs; build it from dmath::exp" },
    { path = "f32::asinh", reason = "platform libm differs; build it from dmath::ln and dmath::sqrt" },
    { path = "f32::acosh", reason = "platform libm differs; build it from dmath::ln and dmath::sqrt" },
    { path = "f32::atanh", reason = "platform libm differs; build it from dmath::ln" },
    { path = "f32::cbrt", reason = "platform libm differs; no deterministic replacement in dmath yet" },
    { path = "f64::sin", reason = "platform libm differs; simulation math is f32 via grimoire_core::math::dmath" },
    { path = "f64::cos", reason = "platform libm differs; simulation math is f32 via grimoire_core::math::dmath" },
    { path = "f64::tan", reason = "platform libm differs; simulation math is f32 via grimoire_core::math::dmath" },
    { path = "f64::asin", reason = "platform libm differs; simulation math is f32 via grimoire_core::math::dmath" },
    { path = "f64::acos", reason = "platform libm differs; simulation math is f32 via grimoire_core::math::dmath" },
    { path = "f64::atan", reason = "platform libm differs; simulation math is f32 via grimoire_core::math::dmath" },
    { path = "f64::atan2", reason = "platform libm differs; simulation math is f32 via grimoire_core::math::dmath" },
    { path = "f64::exp", reason = "platform libm differs; simulation math is f32 via grimoire_core::math::dmath" },
    { path = "f64::ln", reason = "platform libm differs; simulation math is f32 via grimoire_core::math::dmath" },
    { path = "f64::powf", reason = "platform libm differs; simulation math is f32 via grimoire_core::math::dmath" },
    { path = "f64::hypot", reason = "platform libm differs; simulation math is f32 via grimoire_core::math::dmath" },
    { path = "f64::mul_add", reason = "fused multiply-add is not used in simulation code" },
    { path = "f64::sin_cos", reason = "platform libm differs; simulation math is f32 via grimoire_core::math::dmath" },
    { path = "f64::powi", reason = "precision is platform-dependent; simulation math is f32 via grimoire_core::math::dmath" },
