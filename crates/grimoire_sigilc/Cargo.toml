[package]
name = "grimoire_sigilc"
description = "Sigil compiler library and CLI `sigilc`: offline parser, validator and compiler for the Sigil pattern language; never a dependency of a runtime crate (engine ADR-0008)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license-file.workspace = true
publish.workspace = true

[[bin]]
name = "sigilc"
path = "src/bin/sigilc.rs"

# Determinism-set crate (contract §3): its output (binary Sigil units) enters content hashes,
# golden masters and replays and must be byte-identical on Windows, Linux and macOS, so it obeys
# the same rules as the simulation crates even though it never runs at game time. `sim`/`ecs` are
# needed for the `sigilc simulate` subcommand (Plan 0002 WP5.6), not for compiling alone.
# `serde`/`serde_json` back the diagnostic JSON documents of WP4.1 (contract §2 rule 11,
# `sigilc --json`) and, since WP4.3, the CLI's build/values/set documents and the behaviour
# manifest it reads; both are already workspace-pinned third-party dependencies (used the same way
# by `grimoire_bench`, contract §15), so wiring them into this crate needs no new pin (rule 4).
[dependencies]
grimoire_core.workspace = true
grimoire_ecs.workspace = true
grimoire_sigil.workspace = true
grimoire_sim.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# `proptest` (already workspace-pinned, used the same way by five other crates) drives the
# roundtrip and no-panic properties required by WP4.1 (parse -> fmt -> parse over the corpus and
# over arbitrary generated sources; arbitrary bytes and truncated files never panic or hang).
[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
