# Determinism lint (engine ADR 0004, engine ADR 0008, PRD-0018 FR-09). Keep this file identical
# in grimoire_core, grimoire_ecs, grimoire_sim, grimoire_collide, grimoire_sigil, grimoire_sigilc
# and the facade grimoire. The five simulation crates plus the facade feed TickInput and systems
# into the simulation (main loop, InputMap and examples). grimoire_sigilc is a compiler, not a
# runtime crate, but its output (compiled Sigil units) enters content hashes, golden masters and
# replays and must be byte-identical on Windows, Linux and macOS, so the same float, thread and
# hash-container rules apply to it (engine ADR-0008, contract §3).
# Simulation-side crates must not depend on wall-clock time, unordered hash containers, threads of
# their own (simulation threads come only from grimoire_exec, engine ADR-0006) or the platform
# libm. Inherent float methods are written `f32::name` / `f64::name`; clippy silently
# ignores paths that do not resolve, so verify every new entry with a lint probe (ADR 0004).
disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order is not deterministic; use BTreeMap or an ordered Vec" },
    { path = "std::collections::HashSet", reason = "iteration order is not deterministic; use BTreeSet or an ordered Vec" },
]
disallowed-methods = [
    { path = "std::time::Instant::now", reason = "wall-clock time must not influence simulation state; use the Tick resource" },
    { path = "std::time::Instant::elapsed", reason = "wall-clock time must not influence simulation state; use the Tick resource" },
    { path = "std::time::SystemTime::now", reason = "wall-clock time must not influence simulation state; use the Tick resource" },
    { path = "std::time::SystemTime::elapsed", reason = "wall-clock time must not influence simulation state; use the Tick resource" },
    { path = "std::thread::spawn", reason = "simulation threads come only from grimoire_exec behind grimoire_ecs::Executor (engine ADR-0006)" },
    { path = "std::thread::Builder::spawn", reason = "simulation threads come only from grimoire_exec behind grimoire_ecs::Executor (engine ADR-0006)" },
    { path = "std::thread::Builder::spawn_scoped", reason = "simulation threads come only from grimoire_exec behind grimoire_ecs::Executor (engine ADR-0006)" },
    { path = "std::thread::scope", reason = "simulation threads come only from grimoire_exec behind grimoire_ecs::Executor (engine ADR-0006)" },
    { path = "f32::min", reason = "the zero sign of min(+0.0, -0.0) changes with the optimisation level; use grimoire_core::math::dmath::min" },
    { path = "f32::max", reason = "the zero sign of max(+0.0, -0.0) changes with the optimisation level; use grimoire_core::math::dmath::max" },
    { path = "f64::min", reason = "the zero sign of min(+0.0, -0.0) changes with the optimisation level; simulation math is f32 with grimoire_core::math::dmath" },
    { path = "f64::max", reason = "the zero sign of max(+0.0, -0.0) changes with the optimisation level; simulation math is f32 with grimoire_core::math::dmath" },
    { path = "f32::sin", reason = "platform libm differs; use grimoire_core::math::dmath::sin" },
    { path = "f32::cos", reason = "platform libm differs; use grimoire_core::math::dmath::cos" },
    { path = "f32::tan", reason = "platform libm differs; use grimoire_core::math::dmath::tan" },
    { path = "f32::sin_cos", reason = "platform libm differs; use grimoire_core::math::dmath::sin and cos" },
    { path = "f32::asin", reason = "platform libm differs; use grimoire_core::math::dmath::asin" },
    { path = "f32::acos", reason = "platform libm differs; use grimoire_core::math::dmath::acos" },
    { path = "f32::atan", reason = "platform libm differs; use grimoire_core::math::dmath::atan" },
    { path = "f32::atan2", reason = "platform libm differs; use grimoire_core::math::dmath::atan2" },
    { path = "f32::exp", reason = "platform libm differs; use grimoire_core::math::dmath::exp" },
    { path = "f32::ln", reason = "platform libm differs; use grimoire_core::math::dmath::ln" },
